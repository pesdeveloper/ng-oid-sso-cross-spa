<mat-toolbar color="primary" class="app-toolbar">
  <span class="toolbar-title">{{ auth.clientLabel() }}</span>
  <span class="toolbar-spacer"></span>
  @if (auth.isAuthenticated()) {
    <button mat-button class="toolbar-action" (click)="logout()">
      <mat-icon fontSet="material-icons">logout</mat-icon>
      Logout
    </button>
  } @else {
    <button mat-button class="toolbar-action btn-success" (click)="login()">
      <mat-icon fontSet="material-icons">login</mat-icon>
      Iniciar sesión
    </button>
  }
</mat-toolbar>

<mat-divider></mat-divider>

<div class="main-container">
  <router-outlet></router-outlet>
</div>
